name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Dependencies
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          rubygems: latest

      # Lint
      - name: Run linter
        run: bin/lint --nofix

  development_demo:
    name: Tests for Development and Demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGUSER: good_job
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_PATH: vendor/bundle
      DISABLE_SPRING: 1
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: good_job
          POSTGRES_DB: good_job_test
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Dependencies
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          rubygems: latest

      # Validate Development Environment
      - name: bin/setup
        run: bin/rails db:test:prepare
      - name: bin/rspec
        run: bin/rspec --require ./spec/support/pre_documentation_formatter.rb --format PreDocumentationFormatter
      # Archive
      - name: Archive system spec screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-devenv
          path: |
            demo/tmp/screenshots
            demo/tmp/capybara
      - name: Archive Rails logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rails_logs-devenv
          path: demo/log

  test:
    name: Test - ${{ matrix.gemfile }} - Ruby ${{ matrix.ruby }} - PG ${{ matrix.pg }}${{ matrix.async_name && format(' - Async {0}', matrix.async_name) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rails 6.1: lowest (Ruby 3.0) and highest (Ruby 4.0)
          - { ruby: "3.0", gemfile: rails_6.1, pg: 18 }
          - { ruby: "4.0", gemfile: rails_6.1, pg: 18 }
          # Rails 7.0 (fiber execution requires Rails 7.1)
          - { ruby: "3.0", gemfile: rails_7.0, pg: 18 }
          - { ruby: "4.0", gemfile: rails_7.0, pg: 18 }
          # Rails 7.1 (Ruby 3.2 is the minimum for fibers)
          - { ruby: "3.0", gemfile: rails_7.1, pg: 18 }
          - { ruby: "3.2", gemfile: rails_7.1, pg: 18 }
          - { ruby: "4.0", gemfile: rails_7.1, pg: 18 }
          # Rails 7.2 (requires Ruby >= 3.1)
          - { ruby: 3.1, gemfile: rails_7.2, pg: 18 }
          - { ruby: "4.0", gemfile: rails_7.2, pg: 18 }
          # Rails 8.0 (requires Ruby >= 3.2)
          - { ruby: 3.2, gemfile: rails_8.0, pg: 18 }
          - { ruby: "4.0", gemfile: rails_8.0, pg: 18 }
          # Rails 8.1 (requires Ruby >= 3.2)
          - { ruby: 3.2, gemfile: rails_8.1, pg: 18 }
          - { ruby: "4.0", gemfile: rails_8.1, pg: 18 }
          # Rails head (requires Ruby >= 3.3)
          - { ruby: 3.3, gemfile: rails_head, pg: 18 }
          - { ruby: "4.0", gemfile: rails_head, pg: 18 }
          # Ruby 3.4 + older PG (covers Ruby 3.4 and PG compatibility)
          - { ruby: 3.4, gemfile: rails_7.2, pg: 10 }
          # JRuby 10 targets Ruby 3.4
          - { ruby: jruby-10.0, gemfile: rails_7.2, pg: 18 }
          # Async: minimum, latest, unsupported, and absent
          - { ruby: "3.2", gemfile: async_compatibility, rails_version: "7.1", async: "2.24.0", async_name: minimum, pg: 18 }
          - { ruby: "4.0", gemfile: async_compatibility, async: "2.25.0", async_name: minimum, pg: 18 }
          - { ruby: "4.0", gemfile: async_compatibility, async: "2.24.0", async_name: older_ruby4, pg: 18 }
          - { ruby: "4.0", gemfile: async_compatibility, async: ">= 2.24", async_name: latest, pg: 18 }
          - { ruby: "4.0", gemfile: async_compatibility, async: "2.23.0", async_name: older, pg: 18 }
          - { ruby: "4.0", gemfile: async_compatibility, async: absent, async_name: absent, pg: 18 }

    env:
      PGHOST: localhost
      PGUSER: good_job
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_PATH: vendor/bundle
      BUNDLE_WITHOUT: debug:lint:demo:production
      RAILS_LOG_TO_STDOUT: false
      RAILS_VERSION: ${{ matrix.rails_version || '8.1' }}
      GOOD_JOB_REQUIRE_FIBERS: ${{ matrix.gemfile != 'rails_6.1' && matrix.gemfile != 'rails_7.0' && matrix.ruby != '3.0' && matrix.ruby != '3.1' && matrix.ruby != 'jruby-10.0' && matrix.async != 'absent' && matrix.async != '2.23.0' && matrix.async_name != 'older_ruby4' && '1' || '0' }}
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: good_job
          POSTGRES_DB: good_job_test
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: browser-actions/setup-chrome@latest
      - run: chrome --version
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Update .ruby-version with matrix value
        run: echo "${{ matrix.ruby }}" >| .ruby-version
      - name: Select Async version
        if: matrix.async
        env:
          ASYNC_REQUIREMENT: ${{ matrix.async }}
        run: echo "GOOD_JOB_TEST_ASYNC=$ASYNC_REQUIREMENT" >> "$GITHUB_ENV"
      # Dependencies
      - name: Set up Ruby and bundle install
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          rubygems: latest
          cache-version: ${{ matrix.async_name || 'default' }}
      - name: Resolve newest compatible Async
        if: matrix.async == '>= 2.24'
        run: bundle update async
      -  name: Print Lockfile
         run: cat ${{ env.BUNDLE_GEMFILE }}.lock

      # Test
      - name: Set up test database
        run: bundle exec demo/bin/rails db:test:prepare
      - name: Run Unit tests
        run: |
          bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb, spec/generators/**/*_spec.rb" \
                                      --require ./spec/support/pre_documentation_formatter.rb \
                                      --format PreDocumentationFormatter
      - name: Run System tests
        run: |
          bundle exec rspec --require ./spec/support/pre_documentation_formatter.rb \
                                      --format PreDocumentationFormatter \
                                      spec/system

      - name: Run Generators tests
        run: |
          bundle exec rspec --require ./spec/support/pre_documentation_formatter.rb \
                                      --format PreDocumentationFormatter \
                                      spec/generators

      # Archive
      - name: Archive system spec screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.gemfile }}-${{ matrix.ruby }}-${{ matrix.pg }}-${{ matrix.async_name || 'default' }}
          path: |
            demo/tmp/screenshots
            demo/tmp/capybara
      - name: Archive Rails logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rails_logs-${{ matrix.gemfile }}-${{ matrix.ruby }}-${{ matrix.pg }}-${{ matrix.async_name || 'default' }}
          path: demo/log
